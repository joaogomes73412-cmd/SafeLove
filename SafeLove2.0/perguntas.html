const telaSelecao = document.querySelector('.selecionaralternativas');
const telaQuestionario = document.getElementById('telaQuestionario');

const tituloProblema = document.getElementById('tituloProblema');
const perguntaProblema = document.getElementById('perguntaProblema');
const alternativasQuestionario =
    document.getElementById('alternativasQuestionario');

const proximoQuestionario =
    document.getElementById('proximoQuestionario');


// Guarda os problemas selecionados
let problemasSelecionados = [];

// Descobre em qual problema estamos
let indiceProblema = 0;

// Guarda as respostas de cada problema
const respostas = {};


// QUANDO CLICAR NO PRIMEIRO "PRÓXIMO"
proximo.addEventListener('click', function () {

    const selecionadas =
        document.querySelectorAll('.opcao-desafio.selecionada');

    problemasSelecionados = Array.from(selecionadas)
    .filter(opcao => opcao.id !== 'alternativa0')
    .map(opcao => ({
        id: opcao.id,
        nome: opcao.textContent
    }));

    if (problemasSelecionados.length === 0) {
        return;
    }

    indiceProblema = 0;

    telaSelecao.style.display = 'none';
    telaQuestionario.style.display = 'block';

    mostrarProblema();
});


// MOSTRA O PROBLEMA ATUAL
function mostrarProblema() {

    const problemaAtual =
    problemasSelecionados[indiceProblema];

const idProblema =
    problemaAtual.id;

const dados =
    perguntasPorOpcao[idProblema];

    if (!dados) {

        tituloProblema.textContent = "Questionário";

        perguntaProblema.textContent =
            "Ainda não existe uma pergunta cadastrada para esta opção.";

        alternativasQuestionario.innerHTML = "";

        return;
    }

    tituloProblema.textContent = dados.nome;

    perguntaProblema.textContent = dados.pergunta;

    alternativasQuestionario.innerHTML = "";


    // Cria as alternativas
    dados.opcoes.forEach((opcao) => {

        const botao = document.createElement('button');

        botao.type = "button";
        botao.classList.add('resposta-questionario');

        botao.textContent = opcao;

        botao.dataset.valor = opcao;


        // SELEÇÃO MÚLTIPLA
        botao.addEventListener('click', function () {

            // Marca ou desmarca
            botao.classList.toggle('selecionada');


            // Pega todas as alternativas selecionadas
            const selecionadas =
                alternativasQuestionario.querySelectorAll(
                    '.resposta-questionario.selecionada'
                );


            // Transforma em array
            respostas[idProblema] =
                Array.from(selecionadas)
                    .map(item => item.dataset.valor);

        });


        alternativasQuestionario.appendChild(botao);
    });
}


// BOTÃO PRÓXIMO DO QUESTIONÁRIO
proximoQuestionario.addEventListener('click', function () {

    const idProblema =
        problemasSelecionados[indiceProblema].id;


    // Verifica se pelo menos uma resposta foi selecionada
    if (
        !respostas[idProblema] ||
        respostas[idProblema].length === 0
    ) {

        alert("Selecione pelo menos uma opção antes de continuar.");

        return;
    }


    // Próximo problema
    indiceProblema++;


    // Ainda existem problemas?
    if (indiceProblema < problemasSelecionados.length) {

        mostrarProblema();

    } else {

        localStorage.setItem(
    "problemasSelecionados",
    JSON.stringify(problemasSelecionados)
);

localStorage.setItem(
    "respostasProblemas",
    JSON.stringify(respostas)
);

window.location.href = "avaliecomemoje.html";
    }

});

</script>
